<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>DP Strength Tracker - progressive overload</title>
<style>
  :root{
    --bg:#0b111c; --card:#131c2b; --card-line:#1f2b3d; --input:#0f1826; --input-line:#263449;
    --ink:#e8edf4; --muted:#8595ab; --dim:#6f7f96;
    --go:#7bedb4; --go-line:#2f7a54; --go-bg:#12291f;
    --hold:#9fb0c7; --hold-line:#2b3a4f; --hold-bg:#182433; --hold-ink:#7aa0cc;
    --warn:#e0b64d; --warn-line:#6b4f1f; --warn-bg:#2a2113; --warn-ink:#e0b64d;
    --pb:#b9a6ee;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;justify-content:center;padding:16px 0 60px}
  .phone{width:100%;max-width:412px;padding:0 14px}
  .day-head{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 14px}
  .day-name{font-size:12px;letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
  .day-prog{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}

  .ex{border:1px solid var(--card-line);background:var(--card);border-radius:12px;margin-bottom:8px;overflow:hidden;transition:border-color .15s}
  .ex.state-go{border-color:var(--go-line)}
  .ex.state-warn{border-color:var(--warn-line)}
  .ex.done{opacity:.55}

  .ex-row{display:flex;align-items:center;gap:9px;padding:12px 13px;cursor:pointer}
  .ex-main{flex:1;min-width:0}
  .ex-name{font-size:14px;font-weight:500;line-height:1.2}
  .ex-why{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3}
  .ex-why.go{color:#7f9d8b}
  .ex-why.warn{color:#c9a86a}

  .chip{display:flex;align-items:center;gap:5px;border-radius:8px;padding:6px 10px;
    font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;border:1px solid var(--hold-line);background:var(--hold-bg);color:var(--hold)}
  .chip.go{border-color:var(--go-line);background:var(--go-bg);color:var(--go)}
  .chip.warn{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
  .chip .ar{font-size:14px;line-height:1}
  .chip.go .ar{color:var(--go)} .chip.hold .ar{color:var(--hold-ink)} .chip.warn .ar{color:var(--warn-ink)}
  .chev{font-size:12px;color:var(--dim);width:14px;text-align:center;transition:transform .18s}
  .ex.open .chev{transform:rotate(180deg)}

  .ex-body{display:none;padding:0 13px 13px}
  .ex.open .ex-body{display:block}

  .ladder{display:flex;gap:5px;margin:4px 0 11px}
  .rung{flex:1;border:1px solid var(--input-line);background:var(--input);border-radius:8px;padding:7px 4px;text-align:center}
  .rung .rl{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
  .rung .rt{font-size:11px;color:var(--hold);margin-top:3px}
  .rung.done{opacity:.7}
  .rung.done .rt{color:var(--hold)}
  .rung.active{border-color:var(--go-line);background:var(--go-bg)}
  .rung.active .rl{color:#5fae82}
  .rung.active .rt{color:var(--go);font-weight:500}
  .rung.upcoming{opacity:.5}
  .rung.warn.active{border-color:var(--warn-line);background:var(--warn-bg)}
  .rung.warn.active .rl{color:var(--warn-ink)} .rung.warn.active .rt{color:var(--warn-ink)}

  .pb-line{display:flex;gap:8px;font-family:var(--mono);font-size:10px;color:var(--dim);margin-bottom:10px}
  .pb-line b{color:var(--pb);font-weight:600}

  .set-head,.set{display:grid;grid-template-columns:20px 1fr 1fr 46px 40px;gap:6px;align-items:center}
  .set-head{font-size:9px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;margin-bottom:5px}
  .set-head span{text-align:center}
  .set{margin-top:6px}
  .set .n{font-size:12px;color:var(--dim);text-align:center}
  .cell{height:42px;border:1px solid var(--input-line);background:var(--input);border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink);
    width:100%;text-align:center;font-variant-numeric:tabular-nums}
  .cell::placeholder{color:#4c5f79}
  input.cell{outline:none}
  input.cell:focus{border-color:var(--go-line)}
  .rpe{color:var(--dim);font-size:14px}
  .tick{justify-self:center;width:26px;height:26px;border-radius:50%;border:1.6px solid var(--hold-line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:transparent;font-size:14px;transition:.12s}
  .tick.on{background:var(--go-bg);border-color:var(--go-line);color:var(--go)}

  .tip{font-size:11px;color:#8fa2bd;line-height:1.5;margin-top:10px;display:flex;gap:6px}
  .tip .i{color:var(--warn);flex-shrink:0}
  .add-set{margin-top:11px;text-align:center;font-size:12px;color:var(--muted);
    border:1px dashed var(--input-line);border-radius:8px;padding:9px;cursor:pointer}
  .foot{font-family:var(--mono);font-size:10px;color:var(--dim);margin:2px 0 0;line-height:1.5}

  .note{max-width:412px;padding:0 16px;margin:22px auto 0;color:var(--dim);font-size:12px;line-height:1.6}
</style>
</head>
<body>
<div class="phone" id="app"></div>

<div class="note" id="note"></div>

<script>
/* ---- Progression engine (trimmed inline copy of progressive-overload.js) ---- */
function parseRange(r){const m=String(r||'').match(/(\d+)\s*[-–]\s*(\d+)/);
  if(m)return{low:+m[1],high:+m[2]};const o=String(r||'').match(/(\d+)/);
  return o?{low:+o[1],high:+o[1]}:{low:8,high:12};}
function roundPlate(w,inc){inc=inc||2.5;return Math.round(w/inc)*inc;}
function loadInc(w){let add=w<=60?2.5:5;add=Math.min(add,w*0.10);return Math.max(2.5,roundPlate(add,2.5));}

/* prescription: {exercise, workingSets, repRange}
   last: {weight, reps:[..per working set..], pb, stalledWeeks}  (already parsed for the demo) */
function decide(p, last){
  const range=parseRange(p.repRange), sets=+p.workingSets||2;
  if(!last)return{state:'first',lever:'baseline',chip:'Set base',chipCls:'hold',ar:'',
    why:'First time. Find your weight.',whyCls:'',
    target:{kg:null,reps:range.low},range,sets,
    tip:'Pick a weight you control for '+range.low+' clean reps with 2 to 3 tough ones left. Nail the form first.'};

  const hitTop = last.reps.length>=sets && last.reps.every(r=>r>=range.high);
  const minReps = Math.min(...last.reps);

  if(last.stalledWeeks && last.stalledWeeks>=3){
    const dl=roundPlate(last.weight*0.9,2.5);
    return{state:'warn',lever:'reset',chip:dl+'',chipCls:'warn',ar:'↻',
      why:'Stuck '+last.stalledWeeks+' weeks. Reset to '+dl+'kg.',whyCls:'warn',
      target:{kg:dl,reps:range.high},range,sets,
      tip:'A stall is usually fatigue or form, not weakness. Drop to '+dl+'kg, own every rep, then climb back.'};
  }
  if(hitTop){
    const nw=roundPlate(last.weight+loadInc(last.weight),2.5);
    return{state:'go',lever:'load',chip:nw+'',chipCls:'go',ar:'↗',
      why:'Maxed reps at '+last.weight+'kg. Level up.',whyCls:'go',
      target:{kg:nw,reps:range.low},range,sets,
      tip:'New weight, so reps reset to '+range.low+'. Build back to '+range.high+', then go up again.'};
  }
  const next=Math.min(range.high,minReps+1);
  return{state:'hold',lever:'reps',chip:last.weight+'',chipCls:'hold',ar:'→',
    why:'Hold '+last.weight+'kg, add a rep.',whyCls:'',
    target:{kg:last.weight,reps:next},range,sets,
    tip:'Same weight today. Squeeze at least one more rep per set. Hit '+range.high+' on all '+sets+' sets to earn a load bump.'};
}

/* ---- Sample session: one of each state ---- */
const SESSION={ day:'Push day', exercises:[
  { p:{exercise:'Bench press',workingSets:'2',repRange:'8-12'},
    last:{weight:60,reps:[10,9],pb:65} },
  { p:{exercise:'Rear delt fly',workingSets:'2',repRange:'8-12'},
    last:{weight:32,reps:[15,15],pb:39}, openByDefault:true },
  { p:{exercise:'Overhead press',workingSets:'2',repRange:'8-10'},
    last:{weight:30,reps:[9,8],pb:35} },
  { p:{exercise:'Tricep pushdown',workingSets:'3',repRange:'10-12'},
    last:{weight:27.5,reps:[11,10,10],pb:30,stalledWeeks:3} },
  { p:{exercise:'Lateral raise',workingSets:'3',repRange:'12-15'},
    last:null },
]};

/* ---- Render ---- */
const AR_TITLE={go:'Add load',reps:'Add a rep',reset:'Reset',baseline:'Set base'};
function ladderHTML(d){
  if(d.state==='first')return '';
  const warnCls = d.state==='warn' ? ' warn' : '';
  const steps = d.state==='warn'
    ? [['Reset','active'+warnCls],['Rebuild','upcoming'],['Push on','upcoming']]
    : [['Own reps', d.lever==='load'?'done':'active'],
       ['Add load', d.lever==='load'?'active':'upcoming'],
       ['New base','upcoming']];
  return '<div class="ladder">'+steps.map(s=>
    '<div class="rung '+s[1]+'"><div class="rl">'+ (s[1].indexOf('done')>-1?'&#10003; ':'') +'</div><div class="rt">'+s[0]+'</div></div>'
  ).join('')+'</div>';
}
function setsHTML(d,exIndex){
  const kg = d.target.kg==null ? '' : d.target.kg;
  let rows='';
  for(let i=1;i<=d.sets;i++){
    rows+='<div class="set"><span class="n">'+i+'</span>'+
      '<input class="cell" inputmode="decimal" placeholder="'+(kg===''?'--':kg)+'">'+
      '<input class="cell" inputmode="numeric" placeholder="'+d.target.reps+'">'+
      '<div class="cell rpe">--</div>'+
      '<div class="tick" data-ex="'+exIndex+'" data-set="'+i+'">&#10003;</div></div>';
  }
  return '<div class="set-head"><span></span><span>Kg</span><span>Reps</span><span>RPE</span><span>&#10003;</span></div>'+rows;
}
function exHTML(item,i){
  const d=decide(item.p,item.last);
  const open=item.openByDefault?' open':'';
  const stateCls = d.state==='go'?' state-go' : d.state==='warn'?' state-warn' : '';
  const pb = item.last && item.last.pb ? '<div class="pb-line">PB <b>'+item.last.pb+'kg</b></div>' : '';
  return '<div class="ex'+stateCls+open+'" data-ex="'+i+'">'+
    '<div class="ex-row" onclick="toggleEx('+i+')">'+
      '<div class="ex-main"><div class="ex-name">'+item.p.exercise+'</div>'+
        '<div class="ex-why '+d.whyCls+'">'+d.why+'</div></div>'+
      '<div class="chip '+d.chipCls+'">'+(d.ar?'<span class="ar">'+d.ar+'</span> ':'')+d.chip+'</div>'+
      '<div class="chev">&#9662;</div>'+
    '</div>'+
    '<div class="ex-body">'+
      ladderHTML(d)+ pb +
      setsHTML(d,i)+
      '<div class="tip"><span class="i">&#9788;</span><span>'+d.tip+'</span></div>'+
      '<div class="add-set">+ Add set</div>'+
    '</div>'+
  '</div>';
}
function render(){
  const done=0, total=SESSION.exercises.length;
  document.getElementById('app').innerHTML=
    '<div class="day-head"><div class="day-name">'+SESSION.day+'</div>'+
    '<div class="day-prog" id="prog">'+done+' / '+total+' done</div></div>'+
    SESSION.exercises.map(exHTML).join('');
  document.getElementById('note').innerHTML=
    'Tap any exercise to open it. Green up-arrow means go heavier, blue arrow means hold and add a rep, '+
    'amber means you have stalled so reset. The ladder and tip only show on the open card, so a full day stays scannable.';
}
function toggleEx(i){document.querySelector('.ex[data-ex="'+i+'"]').classList.toggle('open');}
document.addEventListener('click',function(e){
  const t=e.target.closest('.tick'); if(!t)return;
  e.stopPropagation(); t.classList.toggle('on'); updateProg();
});
function updateProg(){
  let done=0;
  SESSION.exercises.forEach((_,i)=>{
    const ticks=[...document.querySelectorAll('.tick[data-ex="'+i+'"]')];
    if(ticks.length && ticks.every(x=>x.classList.contains('on'))){
      done++; document.querySelector('.ex[data-ex="'+i+'"]').classList.add('done');
    } else { document.querySelector('.ex[data-ex="'+i+'"]').classList.remove('done'); }
  });
  document.getElementById('prog').textContent=done+' / '+SESSION.exercises.length+' done';
}
render();
</script>
</body>
</html>
